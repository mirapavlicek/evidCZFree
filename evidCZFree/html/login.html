<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/assets/css/materialize.min.css" rel="stylesheet">
    <link href="/assets/css/custom.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
        }
        .login-container {
            max-width: 420px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card">
            <div class="card-content">
                <span class="card-title center-align" style="margin-bottom: 30px; display:block;">
                    <i class="material-icons large" style="color: #4f46e5;">account_circle</i><br>
                    Přihlášení
                </span>
                
                <form id="loginForm">
                    <div class="input-field">
                        <i class="material-icons prefix">person</i>
                        <input id="username" type="text" class="validate" required>
                        <label for="username">Uživatelské jméno</label>
                    </div>

                    <div class="input-field">
                        <i class="material-icons prefix">lock</i>
                        <input id="password" type="password" class="validate" required>
                        <label for="password">Heslo</label>
                    </div>

                    <div class="center-align" style="margin-top: 30px;">
                        <button class="btn waves-effect waves-light btn-large" type="submit" style="width: 100%;">
                            Přihlásit
                        </button>
                    </div>
                </form>

                <div id="errorMessage" class="red-text center-align" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script src="/assets/js/materialize.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const loginData = { username, password };
            fetch('http://localhost:8080/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/'; // Přesměrování po úspěšném přihlášení
                } else {
                    document.getElementById('errorMessage').innerText = 'Neplatné jméno nebo heslo';
                }
            })
            .catch(error => console.error('Chyba při přihlášení:', error));
        });
    </script>
</body>
</html>
