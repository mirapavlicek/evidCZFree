<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generovat odpisy</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/assets/css/materialize.min.css" rel="stylesheet">
    <link href="/assets/css/custom.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 30px;
            width: 90%;
            max-width: 1000px;
        }
        .info-row {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .info-label {
            font-weight: bold;
            color: #7f8c8d;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigační menu -->
    <nav>
        <div class="nav-wrapper container">
            <a href="/" class="brand-logo"><i class="material-icons">account_balance</i>Evidence</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="/"><i class="material-icons left">list</i>Seznam</a></li>
                <li><a href="/add-item-form.html"><i class="material-icons left">add</i>Nový majetek</a></li>
            </ul>
        </div>
    </nav>

    <!-- Kontejner pro základní informace o majetku -->
    <div class="container">
        <div class="card">
            <div class="card-content">
                <span class="card-title">Generovat odpisy</span>
                
                <!-- Základní informace o majetku -->
                <div class="row">
                    <div class="col s12">
                        <h5 id="assetName" style="margin-bottom: 20px; color: #3498db;">Název majetku</h5>
                    </div>
                    <div class="col s12 m6">
                        <div class="info-row"><span class="info-label">Odpisová kategorie:</span> <span id="depreciationGroup"></span></div>
                        <div class="info-row"><span class="info-label">Druh odpisu:</span> <span id="depreciationMethod"></span></div>
                        <div class="info-row"><span class="info-label">Počet let odpisování:</span> <span id="depreciationLength"></span></div>
                    </div>
                    <div class="col s12 m6">
                        <div class="info-row"><span class="info-label">Vstupní cena:</span> <span id="acquisitionCost"></span> Kč</div>
                        <div class="info-row"><span class="info-label">Daňová cena:</span> <span id="taxValue"></span> Kč</div>
                        <div class="info-row"><span class="info-label">Účetní cena:</span> <span id="accountingValue"></span> Kč</div>
                    </div>
                </div>

                <!-- Tlačítko pro vygenerování odpisů -->
                <div class="center-align" style="margin-top: 20px; margin-bottom: 20px;">
                    <button id="generateDepreciationsBtn" class="btn waves-effect waves-light btn-large orange" onclick="generateDepreciations()">
                        <i class="material-icons left">calculate</i>Generuj odpisy
                    </button>
                </div>

                <!-- Tabulka pro zobrazení odpisů -->
                <table class="striped highlight centered">
                    <thead>
                        <tr>
                            <th>Rok</th>
                            <th>Odpisovaná částka (Kč)</th>
                        </tr>
                    </thead>
                    <tbody id="depreciationsTable">
                        <!-- Odpisy budou načteny sem -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/assets/js/materialize.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Získání ID majetku z URL
            const urlParams = new URLSearchParams(window.location.search);
            const assetNumber = urlParams.get('assetNumber');
            loadAssetData(assetNumber);
        });

        // Načíst data majetku z JSON a naplnit stránku
        function loadAssetData(assetNumber) {
            fetch(`/get-asset?assetNumber=${assetNumber}`)
                .then(response => response.json())
                .then(asset => {
                    // Naplnění základních informací
                    document.getElementById('assetName').innerText = asset.name;
                    document.getElementById('depreciationGroup').innerText = asset.depreciationGroup.groupName;
                    document.getElementById('depreciationMethod').innerText = asset.depreciationMethod;
                    document.getElementById('depreciationLength').innerText = asset.depreciationGroup.depreciationLength;
                    document.getElementById('acquisitionCost').innerText = asset.acquisitionCost;
                    document.getElementById('taxValue').innerText = asset.taxValue || 'N/A';
                    document.getElementById('accountingValue').innerText = asset.accountingValue || 'N/A';

                    // Pokud již jsou odpisy vygenerovány, zobrazit je
                    if (asset.depreciations && asset.depreciations.length > 0) {
                        displayDepreciations(asset.depreciations);
                        // Změna tlačítka na "Přegenerovat"
                        const btn = document.getElementById('generateDepreciationsBtn');
                        btn.innerHTML = '<i class="material-icons left">autorenew</i>Přegenerovat odpisy';
                        btn.classList.remove('orange');
                        btn.classList.add('red');
                        btn.onclick = function() { generateDepreciations(true); };
                    }
                })
                .catch(error => console.error('Chyba při načítání dat majetku:', error));
        }

        // Funkce pro zobrazení odpisů
        function displayDepreciations(depreciations) {
            const tableBody = document.getElementById('depreciationsTable');
            tableBody.innerHTML = ''; // Vyčistit tabulku před zobrazením
            depreciations.forEach(depreciation => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${depreciation.year}</td><td>${depreciation.amount}</td>`;
                tableBody.appendChild(row);
            });
        }

        // Funkce pro vygenerování odpisů
        function generateDepreciations(force = false) {
            const urlParams = new URLSearchParams(window.location.search);
            const assetNumber = urlParams.get('assetNumber');
            
            let url = `/generate-depreciations?assetNumber=${assetNumber}`;
            if (force) {
                if (!confirm('Opravdu chcete přegenerovat odpisy? Stávající plán bude smazán.')) {
                    return;
                }
                url += '&force=true';
            }

            fetch(url, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayDepreciations(data.depreciations);
                    if (!force) {
                         // Po prvním vygenerování změníme tlačítko
                        const btn = document.getElementById('generateDepreciationsBtn');
                        btn.innerHTML = '<i class="material-icons left">autorenew</i>Přegenerovat odpisy';
                        btn.classList.remove('orange');
                        btn.classList.add('red');
                        btn.onclick = function() { generateDepreciations(true); };
                    }
                    M.toast({html: 'Odpisy byly úspěšně vygenerovány', classes: 'green'});
                } else {
                    alert('Chyba: ' + (data.message || 'Nepodařilo se vygenerovat odpisy.'));
                }
            })
            .catch(error => {
                console.error('Chyba:', error);
                alert('Došlo k chybě při komunikaci se serverem.');
            });
        }

    </script>
</body>
</html>
